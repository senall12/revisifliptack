<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Panduan Penggunaan | FLIPTACK</title>

  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }


    /* =====================================================
       BODY
    ===================================================== */

    body {
      min-height: 100vh;
      overflow: hidden;

      font-family: "Segoe UI", Arial, Helvetica, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 10% 10%,
          #ffffff 0%,
          transparent 25%
        ),
        radial-gradient(
          circle at 90% 90%,
          #ffd8e8 0%,
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #f5d5e4,
          #fff7fa,
          #edc5d8
        );
    }


    /* =====================================================
       ORNAMEN BACKGROUND
    ===================================================== */

    .circle {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .circle.one {
      width: 330px;
      height: 330px;

      top: -170px;
      left: -120px;

      background: rgba(228, 88, 148, 0.18);
    }

    .circle.two {
      width: 420px;
      height: 420px;

      right: -180px;
      bottom: -220px;

      background: rgba(217, 94, 145, 0.16);
    }

    .circle.three {
      width: 100px;
      height: 100px;

      right: 12%;
      top: 10%;

      background: rgba(255, 255, 255, 0.30);
    }


    /* =====================================================
       CONTAINER BUKU
    ===================================================== */

    .book-container {
      position: relative;

      z-index: 2;

      height: 91vh;
      max-height: 950px;

      display: flex;
      align-items: center;
      justify-content: center;

      perspective: 1500px;
    }


    /* =====================================================
       HALAMAN BUKU
    ===================================================== */

    .book-page {
      position: relative;

      height: 91vh;
      max-height: 950px;

      aspect-ratio: 1024 / 1536;

      background: #ffffff;

      overflow: hidden;

      border-radius: 6px 14px 14px 6px;

      box-shadow:
        -7px 0 0 #f3dfe7,
        -13px 0 0 #e4c4d3,
        18px 25px 50px rgba(92, 38, 63, 0.24);

      transform:
        rotateY(-3deg)
        rotateX(1deg);

      animation: pageOpen 0.8s ease;
    }


    /* =====================================================
       EFEK GARIS PINGGIR BUKU
    ===================================================== */

    .book-page::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;

      width: 10px;
      height: 100%;

      z-index: 3;

      background:
        linear-gradient(
          to right,
          rgba(190, 123, 151, 0.22),
          rgba(255,255,255,0)
        );

      pointer-events: none;
    }


    /* =====================================================
       GAMBAR PANDUAN
    ===================================================== */

    .guide-image {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }


    /* =====================================================
       EFEK SISI KERTAS
    ===================================================== */

    .paper-edge {
      position: absolute;

      top: 0;
      right: 0;

      width: 8px;
      height: 100%;

      z-index: 4;

      background:
        repeating-linear-gradient(
          to bottom,
          #eee0e6 0px,
          #eee0e6 2px,
          #ffffff 2px,
          #ffffff 7px
        );

      pointer-events: none;
    }


    /* =====================================================
       EFEK CAHAYA HALAMAN
    ===================================================== */

    .book-page::after {
      content: "";

      position: absolute;

      inset: 0;

      z-index: 5;

      background:
        linear-gradient(
          105deg,
          rgba(255,255,255,0.13),
          transparent 20%,
          transparent 80%,
          rgba(255,255,255,0.07)
        );

      pointer-events: none;
    }


    /* =====================================================
       NAVIGASI
    ===================================================== */

    .navigation {
      position: fixed;

      left: 30px;
      right: 30px;
      bottom: 27px;

      z-index: 20;

      display: flex;
      align-items: center;
      justify-content: space-between;

      pointer-events: none;
    }

    .navigation a {
      pointer-events: auto;
    }


    /* =====================================================
       TOMBOL KEMBALI
    ===================================================== */

    .back-button {
      display: inline-flex;

      align-items: center;
      gap: 8px;

      padding: 8px 16px 8px 8px;

      background:
        rgba(255,255,255,0.93);

      color: #9d5574;

      border:
        1px solid rgba(180, 91, 125, 0.18);

      border-radius: 50px;

      text-decoration: none;

      font-size: 12px;
      font-weight: 600;

      box-shadow:
        0 5px 13px rgba(100, 40, 65, 0.11);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
    }

    .back-icon {
      width: 28px;
      height: 28px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #f4c7d9;

      color: #984e6d;

      font-size: 16px;

      line-height: 1;

      transition:
        transform 0.25s ease;
    }

    .back-button:hover {
      background: #ffffff;

      transform: translateY(-3px);

      box-shadow:
        0 9px 18px rgba(100, 40, 65, 0.16);
    }

    .back-button:hover .back-icon {
      transform: translateX(-3px);
    }


    /* =====================================================
       TOMBOL LANJUT
    ===================================================== */

    .next-button {
      display: inline-flex;

      align-items: center;
      gap: 8px;

      padding: 9px 9px 9px 17px;

      background:
        linear-gradient(
          135deg,
          #d66b95,
          #e98aae
        );

      color: #ffffff;

      border:
        1px solid rgba(255,255,255,0.65);

      border-radius: 50px;

      text-decoration: none;

      font-size: 12px;
      font-weight: 600;

      box-shadow:
        0 6px 15px rgba(181, 73, 119, 0.24);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        filter 0.25s ease;
    }

    .next-icon {
      width: 28px;
      height: 28px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: rgba(255,255,255,0.25);

      font-size: 16px;

      line-height: 1;

      transition:
        transform 0.25s ease;
    }

    .next-button:hover {
      transform:
        translateY(-3px);

      filter: brightness(1.04);

      box-shadow:
        0 10px 21px rgba(181, 73, 119, 0.32);
    }

    .next-button:hover .next-icon {
      transform: translateX(3px);
    }


    /* =====================================================
       NOMOR HALAMAN
    ===================================================== */

    .page-number {
      position: fixed;

      left: 50%;
      bottom: 31px;

      z-index: 25;

      transform: translateX(-50%);

      padding: 6px 13px;

      background:
        rgba(255,255,255,0.78);

      border:
        1px solid rgba(180, 91, 125, 0.10);

      border-radius: 30px;

      color: #ad6684;

      font-size: 9px;
      font-weight: 700;

      letter-spacing: 1.6px;

      box-shadow:
        0 4px 11px rgba(100,40,65,0.08);
    }


    /* =====================================================
       ANIMASI BUKA BUKU
    ===================================================== */

    @keyframes pageOpen {

      from {
        opacity: 0;

        transform:
          translateX(25px)
          rotateY(-12deg)
          rotateX(1deg)
          scale(0.97);
      }

      to {
        opacity: 1;

        transform:
          translateX(0)
          rotateY(-3deg)
          rotateX(1deg)
          scale(1);
      }

    }


    /* =====================================================
       TABLET
    ===================================================== */

    @media (max-width: 900px) {

      .book-container {
        height: 88vh;
      }

      .book-page {
        height: 88vh;
      }

      .navigation {
        left: 20px;
        right: 20px;
        bottom: 20px;
      }

      .page-number {
        bottom: 23px;
      }

    }


    /* =====================================================
       HP
    ===================================================== */

    @media (max-width: 600px) {

      body {
        overflow: hidden;
      }

      .circle {
        display: none;
      }

      .book-container {
        width: 100%;
        height: 91vh;
      }

      .book-page {
        width: 92vw;

        height: auto;
        max-height: 91vh;

        aspect-ratio: 1024 / 1536;

        transform: none;

        border-radius:
          5px 10px 10px 5px;

        box-shadow:
          -6px 0 0 #f0d9e4,
          -10px 0 0 #e4c4d3,
          10px 15px 35px rgba(92,38,63,0.22);
      }


      /* Navigasi HP */

      .navigation {
        left: 11px;
        right: 11px;
        bottom: 12px;
      }


      .back-button,
      .next-button {
        font-size: 10px;
      }


      .back-button {
        gap: 5px;

        padding:
          6px 12px 6px 6px;
      }


      .next-button {
        gap: 5px;

        padding:
          6px 6px 6px 12px;
      }


      .back-icon,
      .next-icon {
        width: 25px;
        height: 25px;

        font-size: 14px;
      }


      /* Nomor halaman */

      .page-number {
        bottom: 16px;

        padding: 5px 9px;

        font-size: 7px;

        letter-spacing: 1px;
      }

    }


    /* =====================================================
       HP SANGAT KECIL
    ===================================================== */

    @media (max-width: 380px) {

      .back-button,
      .next-button {
        font-size: 9px;
      }

      .back-button {
        padding:
          5px 9px 5px 5px;
      }

      .next-button {
        padding:
          5px 5px 5px 9px;
      }

      .back-icon,
      .next-icon {
        width: 23px;
        height: 23px;

        font-size: 13px;
      }

      .page-number {
        display: none;
      }

    }

  </style>
</head>


<body>


  <!-- ==================================================
       ORNAMEN BACKGROUND
  ================================================== -->

  <div class="circle one"></div>
  <div class="circle two"></div>
  <div class="circle three"></div>


  <!-- ==================================================
       BUKU
  ================================================== -->

  <main class="book-container">

    <div class="book-page">


      <!-- GAMBAR PANDUAN -->

      <img
        src="panduan-fliptack.png"
        alt="Panduan Penggunaan FLIPTACK"
        class="guide-image"
      >


      <!-- EFEK SISI KERTAS -->

      <div class="paper-edge"></div>

    </div>

  </main>


  <!-- ==================================================
       NOMOR HALAMAN
  ================================================== -->

  


  <!-- ==================================================
       NAVIGASI BAWAH
  ================================================== -->

  <nav
    class="navigation"
    aria-label="Navigasi halaman"
  >


    <!-- KEMBALI -->

    <a
      href="index.html"
      class="back-button"
      aria-label="Kembali ke Cover"
    >

      <span class="back-icon">
        ←
      </span>

      <span>
        Kembali ke Cover
      </span>

    </a>


    <!-- LANJUT -->

    <a
      href="menu.html"
      class="next-button"
      aria-label="Lanjut ke Menu"
    >

      <span>
        Lanjut ke Menu
      </span>

      <span class="next-icon">
        →
      </span>

    </a>


  </nav>


</body>
</html>
