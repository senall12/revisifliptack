<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FLIPTACK | E-Modul IPA</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;

      font-family: "Poppins", Arial, sans-serif;

      background:
        radial-gradient(circle at 20% 20%, #ffffff 0%, transparent 25%),
        radial-gradient(circle at 80% 80%, #ffd6e6 0%, transparent 30%),
        linear-gradient(135deg, #f6d8e5, #fff5f9, #efc6d9);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================
       BACKGROUND ORNAMEN
    ========================= */

    .bg-circle {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .circle-1 {
      width: 350px;
      height: 350px;
      top: -170px;
      left: -120px;
      background: rgba(232, 102, 155, 0.25);
    }

    .circle-2 {
      width: 450px;
      height: 450px;
      bottom: -230px;
      right: -150px;
      background: rgba(216, 93, 143, 0.20);
    }

    /* titik-titik dekorasi */

    .dots {
      position: fixed;
      width: 100px;
      height: 100px;

      background-image: radial-gradient(
        #ffffff 2px,
        transparent 2px
      );

      background-size: 18px 18px;

      opacity: 0.7;
      z-index: 0;
    }

    .dots.left {
      left: 35px;
      top: 40px;
    }

    .dots.right {
      right: 35px;
      bottom: 40px;
    }

    /* =========================
       AREA BUKU
    ========================= */

    .book-container {
      position: relative;
      z-index: 2;

      height: 94vh;
      max-height: 950px;

      display: flex;
      align-items: center;
      justify-content: center;

      perspective: 1800px;
    }

    /* =========================
       COVER
    ========================= */

    .cover {
      position: relative;

      height: 94vh;
      max-height: 950px;

      aspect-ratio: 1024 / 1536;

      background: white;

      border-radius: 5px 12px 12px 5px;

      overflow: hidden;

      box-shadow:
        -12px 0 0 #f1d9e4,
        -18px 0 0 #e8c4d4,
        20px 25px 50px rgba(91, 34, 61, 0.28),
        5px 5px 20px rgba(91, 34, 61, 0.15);

      transform:
        rotateY(-3deg)
        rotateX(1deg);

      animation: coverAppear 1.2s ease-out;
    }

    /* gambar cover */

    .cover img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }

    /* =========================
       EFEK KERTAS
    ========================= */

    .paper-edge {
      position: absolute;

      top: 0;
      right: 0;

      width: 9px;
      height: 100%;

      background:
        repeating-linear-gradient(
          to bottom,
          #f4e4eb 0px,
          #f4e4eb 2px,
          #ffffff 2px,
          #ffffff 6px
        );

      opacity: 0.9;

      pointer-events: none;
    }

    /* efek cahaya */

    .cover::after {
      content: "";

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background:
        linear-gradient(
          105deg,
          rgba(255,255,255,0.18),
          transparent 22%,
          transparent 75%,
          rgba(255,255,255,0.08)
        );

      pointer-events: none;
    }

    /* =========================
       TOMBOL NEXT
    ========================= */

    .next-button {
      position: fixed;

      right: 35px;
      bottom: 35px;

      z-index: 20;
    }

    .next-button a {
      display: flex;
      align-items: center;
      gap: 10px;

      padding: 14px 25px;

      color: white;

      text-decoration: none;

      font-size: 15px;
      font-weight: 700;

      background:
        linear-gradient(
          135deg,
          #d91868,
          #ed4c91
        );

      border-radius: 50px;

      box-shadow:
        0 10px 25px rgba(205, 25, 99, 0.35);

      border: 3px solid rgba(255,255,255,0.85);

      transition: all 0.3s ease;
    }

    .next-button a span {
      font-size: 20px;
      transition: transform 0.3s ease;
    }

    .next-button a:hover {
      transform: translateY(-4px) scale(1.03);

      box-shadow:
        0 15px 30px rgba(205, 25, 99, 0.45);
    }

    .next-button a:hover span {
      transform: translateX(5px);
    }

    /* =========================
       LABEL COVER
    ========================= */

    .cover-label {
      position: fixed;

      left: 35px;
      bottom: 35px;

      z-index: 10;

      padding: 9px 18px;

      border-radius: 30px;

      background: rgba(255,255,255,0.75);

      backdrop-filter: blur(10px);

      color: #a51d58;

      font-size: 12px;
      font-weight: 700;

      letter-spacing: 1.5px;

      box-shadow:
        0 8px 20px rgba(111, 45, 76, 0.12);

      border: 1px solid rgba(255,255,255,0.8);
    }

    /* =========================
       ANIMASI
    ========================= */

    @keyframes coverAppear {

      0% {
        opacity: 0;
        transform:
          translateY(35px)
          rotateY(-12deg)
          rotateX(3deg)
          scale(0.96);
      }

      100% {
        opacity: 1;
        transform:
          translateY(0)
          rotateY(-3deg)
          rotateX(1deg)
          scale(1);
      }
    }

    /* =========================
       TABLET
    ========================= */

    @media (max-width: 900px) {

      .book-container {
        height: 90vh;
      }

      .cover {
        height: 90vh;
      }

      .next-button {
        right: 20px;
        bottom: 20px;
      }

      .cover-label {
        left: 20px;
        bottom: 20px;
      }
    }

    /* =========================
       HP
    ========================= */

    @media (max-width: 600px) {

      body {
        overflow: hidden;
      }

      .book-container {
        width: 100%;
        height: 92vh;
      }

      .cover {
        width: 92vw;
        height: auto;

        max-height: 92vh;

        aspect-ratio: 1024 / 1536;

        transform: none;

        border-radius: 6px 10px 10px 6px;

        box-shadow:
          -7px 0 0 #f1d9e4,
          -11px 0 0 #e8c4d4,
          10px 15px 35px rgba(91, 34, 61, 0.25);
      }

      .next-button {
        right: 18px;
        bottom: 18px;
      }

      .next-button a {
        padding: 11px 18px;

        font-size: 13px;
      }

      .cover-label {
        left: 18px;
        bottom: 20px;

        padding: 7px 13px;

        font-size: 9px;
      }

      .dots {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- Background -->
  <div class="bg-circle circle-1"></div>
  <div class="bg-circle circle-2"></div>

  <div class="dots left"></div>
  <div class="dots right"></div>


  <!-- COVER BUKU -->
  <main class="book-container">

    <div class="cover">

      <img
        src="cover-fliptack.png"
        alt="Cover FLIPTACK E-Modul IPA"
      >

      <div class="paper-edge"></div>

    </div>

  </main>


  <!-- LABEL -->
  <div class="cover-label">
    FLIPTACK • KELAS V
  </div>


  <!-- NEXT -->
  <div class="next-button">

    <a href="panduan.html">
      Mulai Belajar
      <span>➜</span>
    </a>

  </div>


</body>
</html>
